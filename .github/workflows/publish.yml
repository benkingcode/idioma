name: Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        # Node 24 ships with npm 11 (required for trusted publisher OIDC).
        # Node 22.22.2 bundles a broken npm 10: its arborist is missing
        # promise-retry, so any `npm install -g` triggers MODULE_NOT_FOUND
        # before it can self-upgrade.
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Compile translations
        run: pnpm -r --if-present compile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Verify version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          STATUS=0
          for dir in core react ai; do
            VERSION=$(node -p "require('./packages/$dir/package.json').version")
            echo "  @idioma/$dir: $VERSION"
            if [ "$VERSION" != "$TAG_VERSION" ]; then STATUS=1; fi
          done
          if [ "$STATUS" != 0 ]; then
            echo "Version mismatch! Tag: $TAG_VERSION"
            exit 1
          fi
          echo "All versions match: $TAG_VERSION"

      # Each step skips a version npm already has, so after a failed
      # publish, "Re-run failed jobs" publishes only what's missing.
      # @idioma/ai goes last: if it fails (npm can't attach a trusted
      # publisher to a package before its first publish), core and react
      # have still shipped together.
      - name: Publish @idioma/core
        run: ./scripts/publish-if-new.sh @idioma/core

      - name: Publish @idioma/react
        run: ./scripts/publish-if-new.sh @idioma/react

      - name: Publish @idioma/ai
        run: ./scripts/publish-if-new.sh @idioma/ai

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
